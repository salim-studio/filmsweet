[package]
name = "filmsweet-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmsweet-time = { workspace = true }
filmsweet-color = { workspace = true }
filmsweet-frame = { workspace = true }
filmsweet-media = { workspace = true }
filmsweet-avi = { workspace = true }
filmsweet-isobmff = { workspace = true }
filmsweet-matroska = { workspace = true }
filmsweet-mxf = { workspace = true }
filmsweet-mpegts = { workspace = true }
filmsweet-mpeg2v = { workspace = true }
filmsweet-ac3 = { workspace = true }
filmsweet-mpa = { workspace = true }
filmsweet-ogg = { workspace = true }
filmsweet-bitstream = { workspace = true }
filmsweet-h264 = { workspace = true }
filmsweet-hevc = { workspace = true }
filmsweet-vp8 = { workspace = true }
filmsweet-vp9 = { workspace = true }
filmsweet-prores = { workspace = true }
filmsweet-dnx = { workspace = true }
filmsweet-av1 = { workspace = true }
filmsweet-apv = { workspace = true }
filmsweet-aac = { workspace = true }
filmsweet-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
filmsweet-testkit = { workspace = true }
serde_json = { workspace = true }
