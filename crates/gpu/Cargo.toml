[package]
name = "filmsweet-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmsweet-color = { workspace = true }
filmsweet-frame = { workspace = true }
filmsweet-geom = { workspace = true }
filmsweet-project = { workspace = true }
filmsweet-render = { workspace = true }
filmsweet-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "0.4"
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
filmsweet-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
filmsweet-media = { workspace = true }
filmsweet-time = { workspace = true }
