[package]
name = "filmsweet-hevc"
description = "Clean-room pure-Rust H.265/HEVC decoder (ITU-T H.265)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmsweet-bitstream = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
filmsweet-testkit = { workspace = true }
