[package]
name = "filmsweet-engine"
description = "FilmSweet engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["filmsweet-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["filmsweet-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["filmsweet-tts/kokoro", "speech-download"]

[dependencies]
filmsweet-time = { workspace = true }
filmsweet-geom = { workspace = true }
filmsweet-color = { workspace = true }
filmsweet-frame = { workspace = true }
filmsweet-media = { workspace = true }
filmsweet-codecs = { workspace = true }
filmsweet-project = { workspace = true }
filmsweet-edit = { workspace = true }
filmsweet-render = { workspace = true }
filmsweet-scopes = { workspace = true }
filmsweet-text = { workspace = true }
filmsweet-audio-dsp = { workspace = true }
filmsweet-export = { workspace = true }
filmsweet-mxf = { workspace = true }
filmsweet-format = { workspace = true }
filmsweet-interchange = { workspace = true }
filmsweet-captions = { workspace = true }
filmsweet-speech = { workspace = true }
filmsweet-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = "1"

[dev-dependencies]
filmsweet-testkit = { workspace = true }
filmsweet-dng = { workspace = true, features = ["writer"] }
filmsweet-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
