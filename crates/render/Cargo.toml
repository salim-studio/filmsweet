[package]
name = "filmsweet-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmsweet-time = { workspace = true }
filmsweet-geom = { workspace = true }
filmsweet-color = { workspace = true }
filmsweet-frame = { workspace = true }
filmsweet-media = { workspace = true }
filmsweet-project = { workspace = true }
filmsweet-audio-dsp = { workspace = true }
filmsweet-captions = { workspace = true }
filmsweet-text = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
