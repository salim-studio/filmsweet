name: Web App (Pages)

# Builds the FilmSweet web app (WebAssembly) from this repository's source and deploys it to
# https://salim-studio.github.io/filmsweet/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI (must match the crate)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      # apt's binaryen is too old and corrupts wasm-bindgen's externref table
      # ("WebAssembly.Table.grow(): failed to grow table by 4"), so use a current release.
      - name: Install wasm-opt (modern binaryen; apt's is too old for externref tables)
        run: |
          curl -sSL -o /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-version_125/bin" >> "$GITHUB_PATH"
          /tmp/binaryen-version_125/bin/wasm-opt --version

      - name: Build the web app
        run: cargo xtask web

      - name: Prepare the Pages site
        run: |
          rm -rf site && mkdir -p site
          cp -r target/web/dist/. site/
          touch site/.nojekyll
          ls -la site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
