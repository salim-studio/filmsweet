name: Web App (Pages)

# Builds the FilmSweet web app (WebAssembly) from this repository's source and deploys it to
# https://salim-studio.github.io/filmsweet/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI (must match the crate)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install wasm-opt (optional, smaller wasm)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build the web app
        run: cargo xtask web

      - name: Prepare the Pages site
        run: |
          rm -rf site && mkdir -p site
          cp -r target/web/dist/. site/
          touch site/.nojekyll
          ls -la site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
