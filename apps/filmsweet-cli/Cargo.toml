[package]
name = "filmsweet-cli"
description = "FilmSweet headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "filmsweet-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["filmsweet-engine/whisper", "filmsweet-engine/speech-download"]

[dependencies]
filmsweet-engine = { workspace = true }
filmsweet-export = { workspace = true }
filmsweet-project = { workspace = true }
filmsweet-render = { workspace = true }
filmsweet-time = { workspace = true }
filmsweet-gpu = { workspace = true }
filmsweet-media = { workspace = true }
filmsweet-codecs = { workspace = true }
filmsweet-platform = { workspace = true }
filmsweet-mxf = { workspace = true }
filmsweet-mpegts = { workspace = true }
filmsweet-ogg = { workspace = true }
filmsweet-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
filmsweet-testkit = { workspace = true }
