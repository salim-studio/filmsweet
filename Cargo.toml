[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/salim-studio/filmsweet"

[workspace.dependencies]
# internal
filmsweet-time = { path = "crates/time" }
filmsweet-geom = { path = "crates/geom" }
filmsweet-color = { path = "crates/color" }
filmsweet-bitstream = { path = "crates/bitstream" }
filmsweet-isobmff = { path = "crates/isobmff" }
filmsweet-avi = { path = "crates/avi" }
filmsweet-matroska = { path = "crates/matroska" }
filmsweet-mxf = { path = "crates/mxf" }
filmsweet-cfb = { path = "crates/cfb" }
filmsweet-mpegts = { path = "crates/mpegts" }
filmsweet-mpeg2v = { path = "crates/mpeg2v" }
filmsweet-ac3 = { path = "crates/ac3" }
filmsweet-mpa = { path = "crates/mpa" }
filmsweet-ogg = { path = "crates/ogg" }
filmsweet-h264 = { path = "crates/h264" }
filmsweet-hevc = { path = "crates/hevc" }
filmsweet-vp8 = { path = "crates/vp8" }
filmsweet-vp9 = { path = "crates/vp9" }
filmsweet-prores = { path = "crates/prores" }
filmsweet-dnx = { path = "crates/dnx" }
filmsweet-apv = { path = "crates/apv" }
filmsweet-dng = { path = "crates/dng" }
filmsweet-av1 = { path = "crates/av1" }
filmsweet-aac = { path = "crates/aac" }
filmsweet-flac = { path = "crates/flac" }
filmsweet-opus = { path = "crates/opus" }
filmsweet-h264enc = { path = "crates/h264enc" }
filmsweet-audio-dsp = { path = "crates/audio-dsp" }
filmsweet-frame = { path = "crates/frame" }
filmsweet-media = { path = "crates/media" }
filmsweet-codecs = { path = "crates/codecs" }
filmsweet-project = { path = "crates/project" }
filmsweet-edit = { path = "crates/edit" }
filmsweet-interchange = { path = "crates/interchange" }
filmsweet-text = { path = "crates/text" }
filmsweet-captions = { path = "crates/captions" }
filmsweet-speech = { path = "crates/speech" }
filmsweet-tts = { path = "crates/tts" }
filmsweet-tts-text = { path = "crates/tts-text" }
filmsweet-render = { path = "crates/render" }
filmsweet-gpu = { path = "crates/gpu" }
filmsweet-scopes = { path = "crates/scopes" }
filmsweet-export = { path = "crates/export" }
filmsweet-format = { path = "crates/format" }
filmsweet-engine = { path = "crates/engine" }
filmsweet-ui-egui = { path = "crates/ui-egui" }
filmsweet-automation = { path = "crates/automation" }
filmsweet-platform = { path = "crates/platform" }
filmsweet-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
proptest = "1"
roxmltree = "0.21"

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.filmsweet-h264]
opt-level = 3

[profile.dev.package.filmsweet-h264enc]
opt-level = 3

[profile.dev.package.filmsweet-hevc]
opt-level = 3

[profile.dev.package.filmsweet-prores]
opt-level = 3

[profile.dev.package.filmsweet-dnx]
opt-level = 3

[profile.dev.package.filmsweet-apv]
opt-level = 3

[profile.dev.package.filmsweet-dng]
opt-level = 3

[profile.dev.package.filmsweet-av1]
opt-level = 3

[profile.dev.package.filmsweet-aac]
opt-level = 3

[profile.dev.package.filmsweet-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.filmsweet-audio-dsp]
opt-level = 3

[profile.dev.package.filmsweet-mxf]
opt-level = 3

[profile.dev.package.filmsweet-opus]
opt-level = 3

[profile.dev.package.filmsweet-vp8]
opt-level = 3

[profile.dev.package.filmsweet-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
